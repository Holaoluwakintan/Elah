name: Build Android APK (Capacitor Cloud Builder)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      - name: 🧪 Run Release & Performance Gates
        run: npm test

      - name: 🔨 Bundle Web Runtime for Mobile
        run: npm run build:mobile

      - name: 🔑 Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🏗️ Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elah-Warrior-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
